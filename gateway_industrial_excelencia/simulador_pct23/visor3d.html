<script>
// Ventana aparte del visor 3D: lee el estado del simulador de la ventana que la abrió (mismo origen), así el 3D se mueve igual que el sinóptico.
(function () {
  const parametros = new URLSearchParams(location.search);
  const clave = parametros.get('modelo') || 'PLANTA', foco = parametros.get('foco') || undefined;
  let ultimo = PCT.estadoPlanta.crearEstado();          // si no hay simulador detrás, se muestra una planta parada
  function estadoDelSimulador() {
    try {
      const origen = window.opener;
      if (origen && !origen.closed && origen.PCT && origen.PCT.ayuda) { const e = origen.PCT.ayuda.estadoActual(); if (e) ultimo = e; }
    } catch (error) { /* la ventana de origen se cerró: se sigue con el último estado */ }
    return ultimo;
  }
  PCT.visor3d.alCerrar = () => window.close();
  PCT.visor3d.abrir(clave, estadoDelSimulador, foco);
})();
</script>
