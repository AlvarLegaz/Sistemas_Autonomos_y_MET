# Permisos MQTT del gateway PCT23 (se instala como /etc/mosquitto/pct23_acl). Mínimo privilegio por cliente.
# Los topics son los del contrato PCT23 v2.4: pct23/{instance_id}/... Todo lo que no aparece aquí está DENEGADO.
#
# Sintaxis de Mosquitto: «user» abre el bloque de un usuario; «topic read|write|readwrite» da permiso sobre un topic
# (+ = un nivel, # = el resto); «pattern» vale para TODOS los usuarios y sustituye %u por el nombre de usuario.
# Cada usuario aparece UNA sola vez (no se repiten bloques «user»).
#
# QUIÉN PUBLICA QUÉ (contrato §4):
#   la planta (tarjeta o gemelo)  -> sensors, actuators, status (y su LWT), alarms, cmd/{tag}/ack; el gemelo además model
#   el SCADA                      -> cmd/{tag}, scada/heartbeat, params, config
#   la planta LEE                 -> cmd/{tag}, scada/heartbeat (solo tarjeta), params, config (solo tarjeta)
#
# El LWT (status con state «offline») lo publica el broker en nombre de la planta con su propio permiso de escritura en status.

# =====================================================================================================================
# TARJETA real-01 (maqueta PCT23 a través del gateway)
user gateway-real-01
topic write pct23/real-01/sensors
topic write pct23/real-01/actuators
topic write pct23/real-01/status
topic write pct23/real-01/alarms
topic write pct23/real-01/cmd/+/ack
topic read  pct23/real-01/cmd/#
topic read  pct23/real-01/scada/heartbeat
topic read  pct23/real-01/params
topic read  pct23/real-01/config
# TRANSICIÓN (borrar con el resto de líneas «pct_23» cuando todos los clientes hablen el contrato v2.4): MQTT simple antiguo.
# Solo debe haber UNA vía de órdenes activa a la vez (cmd/ o pct_23/salidas), o dos controles podrían contradecirse.
topic write pct_23/entradas
topic read  pct_23/salidas

# =====================================================================================================================
# GEMELO twin-001: como la tarjeta, más model; no usa latido ni config (contrato §4: scada/heartbeat y config son solo de la tarjeta)
user twin-001
topic write pct23/twin-001/sensors
topic write pct23/twin-001/actuators
topic write pct23/twin-001/status
topic write pct23/twin-001/alarms
topic write pct23/twin-001/model
topic write pct23/twin-001/cmd/+/ack
topic read  pct23/twin-001/cmd/#
topic read  pct23/twin-001/params

# =====================================================================================================================
# SCADA (servidor web / ThingsBoard): lee todo y manda órdenes, latido, parámetros y configuración a cualquier planta.
# Escribe cmd/+ (una orden por tag) pero NO cmd/+/ack: los ack solo los publica la planta, así el SCADA no puede falsear una respuesta.
# SUPUESTO: un único usuario «scada» para el servidor web de este repositorio; ThingsBoard u otro SCADA tendría su propio usuario
# (copia este bloque con otro nombre) para poder revocarlo por separado.
user scada
topic read  pct23/#
topic write pct23/+/cmd/+
topic write pct23/+/scada/heartbeat
topic write pct23/+/params
topic write pct23/+/config
# TRANSICIÓN (ver arriba)
topic read  pct_23/entradas
topic write pct_23/salidas

# =====================================================================================================================
# Solo lectura: paneles, registro de datos, pruebas. No puede mandar nada.
user lector
topic read pct23/#
# TRANSICIÓN (ver arriba)
topic read pct_23/entradas

# =====================================================================================================================
# PLANTAS NUEVAS (patrón reutilizable). Convención: el usuario de la planta se llama IGUAL que su instance_id
# (por ejemplo «real-02» o «twin-002»). Entonces estas líneas le dan los permisos de una planta sobre pct23/<usuario>/...
# sin editar este fichero. No incluyen model (el del gemelo se concede aparte, como en twin-001). Como el pattern vale para todas las plantas,
# un gemelo cuyo usuario sea su instancia (twin-001) también podría LEER scada/heartbeat y config de su propia instancia: es inocuo (no los usa).
# Inofensivo para el resto de usuarios: «pct23/scada/...» o «pct23/lector/...» no son instancias reales.
pattern write pct23/%u/sensors
pattern write pct23/%u/actuators
pattern write pct23/%u/status
pattern write pct23/%u/alarms
pattern write pct23/%u/cmd/+/ack
pattern read  pct23/%u/cmd/#
pattern read  pct23/%u/scada/heartbeat
pattern read  pct23/%u/params
pattern read  pct23/%u/config
