# Broker Mosquitto del gateway PCT23 (se instala como /etc/mosquitto/conf.d/gateway.conf con deploy/instalar.sh).
# Pensado para Mosquitto 2.x en Debian/Raspberry Pi OS. Habla MQTT 3.1.1, como pide el contrato PCT23 v2.4 (§2).
#
# SEGURIDAD
#   - NO se acepta ningún cliente sin usuario y contraseña (allow_anonymous false). Si falta el password_file o el
#     acl_file, Mosquitto no arranca: es lo que queremos, antes que arrancar abierto.
#   - Cada usuario solo puede publicar y leer lo que dice deploy/mosquitto_acl.conf (mínimo privilegio).
#   - Los usuarios se crean con deploy/crear_usuarios_mqtt.sh. No hay contraseñas en el repositorio.
#   - El cifrado TLS está preparado más abajo (puerto 8883), desactivado por defecto: el contrato dice «sin TLS en la
#     red del laboratorio» y que se podrá activar después sin cambiar nada (topics, claves y formatos no cambian).
#
# PERSISTENCIA Y REGISTRO
#   El mosquitto.conf de Debian ya define persistence, persistence_location, log_dest y pid_file; repetirlos aquí daría
#   error («duplicate»). SUPUESTO: se usa ese archivo principal. Si se usa este fichero solo (sin el de Debian), añade:
#       persistence true
#       persistence_location /var/lib/mosquitto/
#       log_dest file /var/log/mosquitto/mosquitto.log
#   Con persistence true se conservan los mensajes retained (actuators, status, params, config) al reiniciar el broker;
#   el status de una planta caída lo sustituye su LWT (state "offline").

per_listener_settings false

# ---- Autenticación y permisos (valen para todos los listeners)
allow_anonymous false
password_file /etc/mosquitto/pct23_passwd
acl_file /etc/mosquitto/pct23_acl

# ---- Límites (una planta y un SCADA publican mensajes de unos cientos de bytes)
message_size_limit 65536
max_inflight_messages 20
max_queued_messages 200
persistent_client_expiration 1d

# ---- FASE ACTUAL: broker, gateway y SCADA en la MISMA Raspberry Pi.
# El listener escucha SOLO en el bucle local (127.0.0.1): nada del broker queda expuesto a la red del laboratorio (el único
# servicio hacia la red es el SCADA web, en el 8080). Sin TLS: el tráfico no sale del equipo. Usuarios y ACL siguen activos
# (defensa en profundidad, y así pasar a remoto es cambiar de dirección, no de seguridad).
listener 1883 127.0.0.1
protocol mqtt
max_connections 20

# ---- FASE FUTURA: broker (y SCADA) en OTRA máquina. Ahí el broker central debe escuchar por red y con TLS (8883), y la
# tarjeta se conecta a él. Pasos resumidos (detalle y orden en MQTT_SEGURIDAD.md, «Paso de local a remoto»):
#   1. sudo bash deploy/generar_certificado_mqtt.sh          (crea mqtt.crt y mqtt.key en /etc/mosquitto/certs)
#   2. quitar los «#» de las líneas de abajo y reiniciar:    sudo systemctl restart mosquitto
#   3. en cada cliente, conectar al 8883 con TLS y el certificado como CA
#   4. cuando todos usen el 8883, el listener 1883 local puede seguir solo para el SCADA local o borrarse.
# Aviso: con el broker en otra máquina, un corte de red deja a la tarjeta sin broker; con el latido obligatorio, la maqueta
# pasa a estado seguro (contrato §7).
#listener 8883
#protocol mqtt
#max_connections 20
#certfile /etc/mosquitto/certs/mqtt.crt
#keyfile /etc/mosquitto/certs/mqtt.key
#tls_version tlsv1.2
