<form method="post" action="/salir" id="aula-barra" aria-label="Sesión del aula"{% if con_cuenta %} data-uso="1" data-pagina="{{ pagina }}"{% endif %}>
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <span>{{ nombre }}{% if es_profesor %} (profesor){% endif %}</span>
  <a href="/simuladores">Simuladores</a>
  {% if es_profesor %}<a href="/aula">Aula</a>{% endif %}
  {% if con_cuenta %}<a href="/cuenta">Mi cuenta</a>{% endif %}
  <button type="submit">Cerrar sesión</button>
</form>
{% if con_cuenta %}<script src="/static/uso.js" defer></script>{% endif %}
<style>
  /* Colores de la página que la recibe (--panel, --texto, --borde, --acento, --acento-texto y --fuente existen en los tres simuladores). Barra y botones siguen siendo píldora; sin sombra fuerte. */
  #aula-barra { position: fixed; z-index: 45; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
                padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--panel); color: var(--texto);
                border: 1px solid var(--borde); box-shadow: var(--pol-sombra-flotante); font: 13px/1.2 var(--fuente); margin: 0; }
  #aula-barra span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #aula-barra a { color: var(--acento-texto); }
  #aula-barra button { border: 1px solid var(--borde); background: transparent; color: inherit; border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
  #aula-barra button:hover { border-color: var(--acento); }
  @media (max-width: 960px) { #aula-barra { bottom: 82px; } }
</style>
