<form method="post" action="/salir" id="aula-barra" aria-label="Sesión del aula">
  <input type="hidden" name="csrf" value="{{ csrf() }}">
  <span>{{ nombre }}{% if es_profesor %} (profesor){% endif %}</span>
  {% if es_profesor %}<a href="/aula">Aula</a>{% endif %}
  <button type="submit">Cerrar sesión</button>
</form>
<style>
  #aula-barra { position: fixed; z-index: 45; left: 12px; bottom: 12px; display: flex; align-items: center; gap: 10px; max-width: calc(100vw - 24px);
                padding: 6px 8px 6px 12px; border-radius: 999px; background: var(--panel, #fff); color: var(--texto, #16202A);
                border: 1px solid var(--borde, #BAC4CC); box-shadow: 0 2px 10px rgba(0,0,0,.18); font: 13px/1.2 system-ui, sans-serif; margin: 0; }
  #aula-barra span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #aula-barra a { color: var(--acento, #0B5CAD); }
  #aula-barra button { border: 1px solid var(--borde, #BAC4CC); background: transparent; color: inherit; border-radius: 999px; padding: 5px 12px; font: inherit; cursor: pointer; }
  #aula-barra button:hover { border-color: var(--acento, #0B5CAD); }
  @media (max-width: 960px) { #aula-barra { bottom: 82px; } }
</style>
