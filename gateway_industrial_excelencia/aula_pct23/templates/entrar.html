{% extends "base.html" %}
{% block titulo %}Entrar · Aula PCT23{% endblock %}
{% block contenido %}
<section class="formulario">
  <h1>Entrar</h1>
  <p class="ayuda">Usa el correo con el que te registraste.</p>
  <form method="post" action="{{ url_for('entrar') }}" autocomplete="on">
    <input type="hidden" name="csrf" value="{{ csrf() }}">
    <label>Correo
      <input type="email" name="correo" value="{{ correo }}" autocomplete="username" required autofocus maxlength="254">
    </label>
    <label>Contraseña
      <input type="password" name="clave" autocomplete="current-password" required maxlength="200">
    </label>
    <button class="primario" type="submit">Entrar</button>
  </form>
  <p class="pie">¿Primera vez? <a href="{{ url_for('registro') }}">Registrarme</a>. ¿Eres profesor? <a href="{{ url_for('aula') }}">Entrar al aula</a>.</p>
</section>
{% endblock %}
