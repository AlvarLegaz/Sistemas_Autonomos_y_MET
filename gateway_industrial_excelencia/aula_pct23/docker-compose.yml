services:
  aula:
    build:
      context: ..                       # gateway_industrial_excelencia
      dockerfile: aula_pct23/Dockerfile
    image: pct23-aula
    container_name: pct23-aula
    restart: unless-stopped
    # Sin "ports": a la app solo llega nginx por la red interna; desde fuera no se puede entrar saltándose el HTTPS.
    expose:
      - "8000"
    environment:
      # PIN del aula del profesor (mínimo 6 caracteres). Por defecto 12345678: cámbialo en el archivo .env
      AULA_PIN: ${AULA_PIN:-12345678}
      # Opcionales
      AULA_MODULOS: ${AULA_MODULOS:-}
      AULA_COOKIE_SEGURA: ${AULA_COOKIE_SEGURA:-1}   # con nginx todo va por HTTPS
      AULA_PROXY: "1"                                 # se fía de X-Forwarded-* (IP real del alumno en el bloqueo por intentos)
      AULA_SESION_PROFESOR_MIN: ${AULA_SESION_PROFESOR_MIN:-120}
      AULA_MAX_INTENTOS: ${AULA_MAX_INTENTOS:-5}
      AULA_BLOQUEO_S: ${AULA_BLOQUEO_S:-300}
    volumes:
      - aula_datos:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # nginx delante: HTTPS con certificado propio en los puertos 80 y 447.
  # Antes de arrancar: ./nginx/generar_certificado.sh <IP-o-nombre-del-servidor>
  nginx:
    image: nginx:1.27-alpine
    container_name: pct23-nginx
    restart: unless-stopped
    depends_on:
      aula:
        condition: service_healthy
    ports:
      - "${AULA_PUERTO_HTTP:-80}:80"
      - "${AULA_PUERTO_HTTPS:-447}:447"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/certs:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  aula_datos:
