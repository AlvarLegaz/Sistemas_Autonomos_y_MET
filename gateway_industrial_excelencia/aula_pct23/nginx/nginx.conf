# nginx delante del aula: termina el HTTPS (certificado propio) y reenvía a la app por la red interna de Docker.
# Escucha en 80 y 447, los dos con TLS. Una petición HTTP plana a esos puertos se redirige a https://<host>:447.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_max_body_size 64k;                       # la app limita los formularios a 32 KB

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    server {
        listen 80 ssl;
        listen 447 ssl;
        server_name _;

        ssl_certificate     /certs/aula.crt;
        ssl_certificate_key /certs/aula.key;

        # HTTP en claro sobre un puerto TLS (error 497): redirige a HTTPS
        error_page 497 =301 https://$host:447$request_uri;

        location / {
            proxy_pass http://aula:8000;
            proxy_set_header Host              $http_host;
            # Se sobrescriben (no se acumulan) para que el cliente no pueda falsear su IP ante el bloqueo por intentos
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $http_host;
            proxy_read_timeout 60s;
        }
    }
}
