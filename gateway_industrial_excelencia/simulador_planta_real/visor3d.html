<title>PCT23 · Planta real HTST en 3D</title>
<link rel="icon" type="image/png" href="/simulador/img/favicon.png">
<link rel="stylesheet" href="/comun/css/identidad.css">
<link rel="stylesheet" href="/simulador/css/interfaz.css">
<link rel="stylesheet" href="css/planta_real.css">
</head>
<body class="v3d-ventana">
<script src="js/interfaz/cargador.js"></script>
<script>
// Ventana aparte del 3D: lee el estado de la ventana que la abrió (mismo origen), así el 3D se mueve igual que el SCADA.
(async function () {
  await HTST_CARGADOR.cargarTodo({ conInterfaz: false });
  PCT.htstVisor.registrar();
  const parametros = new URLSearchParams(location.search);
  // Nivel: el de la dirección (?nivel=1), si no el de la ventana que la abrió y, si no, el guardado en el navegador
  const N = PCT.htstNiveles;
  let nivel = N.nivelValido(parametros.get('nivel'));
  if (!nivel) { try { const o = window.opener; if (o && !o.closed && o.PCT && o.PCT.htstApp && o.PCT.htstApp.nivel) nivel = N.nivelValido(o.PCT.htstApp.nivel()); } catch (error) { /* sin ventana de origen */ } }
  if (!nivel) { try { nivel = N.nivelValido(localStorage.getItem(N.CLAVE_ALMACEN)); } catch (error) { /* sin almacenamiento */ } }
  N.fijarNivel(nivel || N.NIVEL_POR_DEFECTO);
  const clave = parametros.get('modelo') || 'HTST', foco = parametros.get('foco') || undefined, solo = parametros.get('solo') === '1';
  let ultimo = null;
  if (!window.opener) {                                   // abierta directamente (sin SCADA detrás): una planta de demostración parada
    await HTST_CARGADOR.cargarScript('js/interfaz/simulacion_demo.js');
    ultimo = PCT.htstDemo.crearSimulacion({}).estado();
  }
  function estadoDelSimulador() {
    try { const o = window.opener; if (o && !o.closed && o.PCT && o.PCT.htstApp) { const e = o.PCT.htstApp.estadoActual(); if (e) ultimo = e; } } catch (error) { /* la ventana de origen se cerró */ }
    return ultimo;
  }
  PCT.visor3d.alCerrar = () => window.close();
  PCT.visor3d.abrir(clave, estadoDelSimulador, foco, undefined, solo);
})();
</script>
</body>
</html>
